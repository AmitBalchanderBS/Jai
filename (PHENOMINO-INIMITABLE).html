<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>(Phenomino-Inimitable): 8 Levels of Mystery</title>
    <style>
        /* CSS styling for a retro pixel-art feel */
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #FFD700;
            text-shadow: 2px 2px #000;
            margin-bottom: 5px;
            font-size: 32px;
        }
        
        h2 {
            margin-top: 0;
            color: #ccc;
        }

        .game-board {
            border: 6px solid #000;
            border-radius: 8px;
            width: 90%;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            height: 350px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            overflow: hidden;
            transition: background 0.5s ease;
        }

        /* Task 1: Hidden Letters Styling */
        .hidden-letter {
            position: absolute;
            font-size: 26px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.15); /* Highly camouflaged */
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
            padding: 10px;
        }

        .hidden-letter:hover {
            color: #FFD700;
            transform: scale(1.3);
            text-shadow: 1px 1px 2px #000;
        }

        /* Task 2: Inventory and Input Area */
        .inventory {
            background: #000;
            padding: 15px;
            margin-top: 20px;
            border: 4px solid #fff;
            display: inline-block;
            width: 90%;
            max-width: 680px;
        }

        input[type="text"] {
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            padding: 8px;
            text-transform: uppercase;
            width: 300px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }

        button {
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            padding: 8px 20px;
            background-color: #e52521;
            color: white;
            border: 3px solid #000;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #ff3b37;
        }

        .found-text { 
            color: #00ff00; 
            letter-spacing: 3px; 
            font-size: 24px;
            min-height: 30px;
            display: block;
            margin-bottom: 15px;
        }
        
        #message {
            font-size: 18px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>(PHENOMINO-INIMITABLE)</h1>
    <h2 id="level-title">Loading Level...</h2>

    <p><strong>Task 1:</strong> Find the hidden letters in the environment.</p>
    <p><strong>Task 2:</strong> Unscramble them to form the level's password.</p>
    
    <div id="game-board" class="game-board">
        <!-- Letters injected here by JavaScript -->
    </div>

    <div class="inventory">
        <p>Letters Found:</p>
        <span id="found-letters" class="found-text"></span>
        <input type="text" id="answer" placeholder="ENTER UNBROKEN WORD" autocomplete="off">
        <br>
        <button onclick="checkAnswer()">SUBMIT</button>
        <p id="message"></p>
    </div>

    <script>
        // --- GAME DATA ---
        // 8 Levels scaling from 6 to 15 letters
        const levels = [
            { name: "Level 1: Forestry", word: "NIKHIL", bg: "linear-gradient(to bottom, #4caf50, #1b5e20)" }, // 6 letters
            { name: "Level 2: Deserty Ln", word: "MIRAGES", bg: "linear-gradient(to bottom, #ffcc80, #e65100)" }, // 7 letters
            { name: "Level 3: Snowy Peaks", word: "BLIZZARD", bg: "linear-gradient(to bottom, #e0f7fa, #80deea)" }, // 8 letters
            { name: "Level 4: Ocean Abyss", word: "SUBMARINE", bg: "linear-gradient(to bottom, #0277bd, #000051)" }, // 9 letters
            { name: "Level 5: Cyber City", word: "TECHNOLOGY", bg: "linear-gradient(to bottom, #4a148c, #000000)" }, // 10 letters
            { name: "Level 6: Haunted Crypt", word: "NECROMANCER", bg: "linear-gradient(to bottom, #212121, #000000)" }, // 11 letters
            { name: "Level 7: Cosmic Void", word: "CONSTELLATION", bg: "linear-gradient(to bottom, #000000, #311b92)" }, // 13 letters
            { name: "Level 8: Quantum Realm", word: "CRYSTALLIZATION", bg: "linear-gradient(to bottom, #880e4f, #1a237e)" } // 15 letters
        ];

        // --- GAME STATE ---
        let currentLevelIndex = 0;
        let collectedLetters = [];

        // --- CORE FUNCTIONS ---
        function initLevel() {
            const levelData = levels[currentLevelIndex];
            
            // Reset UI and state
            collectedLetters = [];
            document.getElementById('found-letters').innerText = "";
            document.getElementById('answer').value = "";
            document.getElementById('message').innerText = "";
            
            // Set Title and Background
            document.getElementById('level-title').innerText = levelData.name;
            const board = document.getElementById('game-board');
            board.style.background = levelData.bg;
            board.innerHTML = ""; // Clear old letters

            // Scramble the word to generate hidden letters
            let lettersArray = levelData.word.split('');
            lettersArray = shuffleArray(lettersArray);

            // Dynamically place letters on the board
            lettersArray.forEach(letter => {
                let span = document.createElement('span');
                span.className = 'hidden-letter';
                span.innerText = letter;
                
                // Random position (keeping it within 5% to 90% bounds to avoid overflow)
                let topPos = Math.floor(Math.random() * 85) + 5;
                let leftPos = Math.floor(Math.random() * 90) + 5;
                
                span.style.top = topPos + '%';
                span.style.left = leftPos + '%';
                
                span.onclick = function() {
                    collectLetter(letter, this);
                };
                
                board.appendChild(span);
            });
        }

        function collectLetter(letter, element) {
            collectedLetters.push(letter);
            document.getElementById('found-letters').innerText = collectedLetters.join(' ');
            element.style.display = 'none'; // Hide collected letter
        }

        function checkAnswer() {
            const levelData = levels[currentLevelIndex];
            const userAnswer = document.getElementById('answer').value.toUpperCase().trim();
            const messageEl = document.getElementById('message');

            if (userAnswer === levelData.word) {
                messageEl.style.color = "#00ff00";
                messageEl.innerText = "Correct! Portal opening to the next area...";
                
                setTimeout(() => {
                    currentLevelIndex++;
                    if (currentLevelIndex < levels.length) {
                        initLevel();
                    } else {
                        document.getElementById('game-board').innerHTML = "<h2 style='color:#FFD700; text-align:center; margin-top:20%; font-size:40px;'>YOU CONQUERED ALL 8 LEVELS!</h2>";
                        document.getElementById('level-title').innerText = "Quest Complete";
                        messageEl.innerText = "Master of the (Phenomino-Inimitable) Realm!";
                    }
                }, 2000);
            } else {
                messageEl.style.color = "#ff0000";
                messageEl.innerText = "Incorrect sequence. The letters reject your answer!";
            }
        }

        // Helper function to shuffle array (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Start the game on page load
        window.onload = initLevel;
    </script>
</body>
</html>
