<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Mix Game - Fixed Version</title>
    <style>
        /* --- CSS STYLES --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background-color: #1e1e24; color: white; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            overflow: hidden; padding-top: 20px;
        }

        .header-bar {
            display: flex; justify-content: space-between; width: 80%;
            margin-bottom: 10px; font-size: 1.5rem; font-weight: bold;
        }
        
        .score-display { color: #32cd32; }
        .level-display { color: #fca311; }

        h1 { margin-bottom: 10px; font-size: 2rem; }
        p.subtitle { margin-bottom: 20px; font-size: 1.1rem; color: #aaa; text-align: center; }

        /* Side-by-Side Workbench Layout */
        .workbench {
            display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 80px;
            width: 100%; height: 65vh;
        }

        .group-container {
            display: flex; gap: 30px; padding: 30px;
            background: rgba(255, 255, 255, 0.03); border-radius: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .group-title {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            background: #1e1e24; padding: 0 15px; color: #888; font-weight: bold; font-size: 1.2rem;
        }

        .tube-container { display: flex; flex-direction: column; align-items: center; }

        /* Test Tube Styling */
        .test-tube {
            width: 80px; height: 220px;
            border: 5px solid rgba(255, 255, 255, 0.4); border-top: none;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
            position: relative; cursor: pointer; overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            transition: transform 1s ease-in-out, box-shadow 0.3s ease; 
            z-index: 1;
        }

        .test-tube.selected {
            transform: translateY(-20px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .test-tube.pouring { z-index: 10; }

        /* Liquid Styling - Now with smoother height transitions */
        .liquid { 
            position: absolute; bottom: 0; width: 100%; height: 45%; 
            transition: background-color 1.5s ease-in-out, height 1s ease-in-out; 
        }

        .label { margin-top: 15px; font-size: 1rem; font-weight: bold; text-align: center; }

        /* Modal Styling */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); justify-content: center; align-items: center; z-index: 20;
        }
        
        .modal-content {
            background: #2b2b36; padding: 40px; border-radius: 15px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 600px; width: 90%;
        }
        
        .modal-content h2 { margin-bottom: 20px; font-size: 2rem; color: #fff; }
        
        .quiz-btn {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            font-size: 1.2rem; background: #3a3a48; color: white; border: none;
            border-radius: 8px; cursor: pointer; font-weight: bold;
            transition: background 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div class="level-display" id="level-display">Level 1</div>
        <div class="score-display" id="score-display">Score: 0</div>
    </div>

    <h1 id="instructions">The Chemistry Lab</h1>
    <p class="subtitle">Tap an additive (Right), then tap a base (Left) to mix and observe.</p>
    
    <div class="workbench">
        <!-- Bases (Left Side) -->
        <div class="group-container" id="bases-group">
            <!-- Injected by JS -->
        </div>

        <!-- Additives (Right Side) -->
        <div class="group-container" id="additives-group">
            <!-- Injected by JS -->
        </div>
    </div>

    <!-- Quiz Modal -->
    <div class="modal" id="quiz-modal">
        <div class="modal-content">
            <h2 id="quiz-question">Question goes here?</h2>
            <div id="quiz-options">
                <!-- Buttons injected by JS -->
            </div>
        </div>
    </div>

    <!-- --- JAVASCRIPT LOGIC --- -->
    <script>
        // --- GAME DATA: The 5 Levels ---
        // Notice the 'reactionColors' array allows for step-by-step color changes!
        const levels = [
            { // Level 1
                bases: [ { id: 'b1', color: 'rgba(255,255,255,0.1)', label: 'Base 1' } ],
                additives: [ { id: 'a1', color: 'rgba(255,20,147,0.8)', label: 'Additive A' } ],
                reactionColors: ['rgba(0,150,255,0.8)', 'rgba(50,205,50,0.9)', 'rgba(255,215,0,0.9)'], // Blue -> Green -> Gold
                question: "What type of additive causes this shifting color change?",
                options: [
                    { text: "Potassium Permanganate", points: 20, status: "correct" },
                    { text: "A Redox Agent", points: 10, status: "partial" },
                    { text: "Food Coloring", points: 0, status: "wrong" }
                ]
            },
            { // Level 2
                bases: [ { id: 'b1', color: 'rgba(255,255,255,0.1)', label: 'Base 1' } ],
                additives: [ 
                    { id: 'a1', color: 'rgba(255,20,147,0.8)', label: 'Additive A' },
                    { id: 'a2', color: 'rgba(0,255,127,0.8)', label: 'Additive B' }
                ],
                reactionColors: ['rgba(255, 69, 0, 0.9)'], // Straight to Red
                question: "Which additive causes an immediate acid flash (Red)?",
                options: [
                    { text: "Acetic Acid (Vinegar)", points: 20, status: "correct" },
                    { text: "A mild acid", points: 10, status: "partial" },
                    { text: "Baking Soda", points: 0, status: "wrong" }
                ]
            },
            { // Level 3
                bases: [ 
                    { id: 'b1', color: 'rgba(255,255,255,0.1)', label: 'Base 1' },
                    { id: 'b2', color: 'rgba(0,100,255,0.3)', label: 'Base 2' }
                ],
                additives: [ 
                    { id: 'a1', color: 'rgba(255,255,0,0.8)', label: 'Additive A' },
                    { id: 'a2', color: 'rgba(255,20,147,0.8)', label: 'Additive B' }
                ],
                reactionColors: ['rgba(255,255,255,0.1)', 'rgba(0, 0, 0, 0.9)'], // Stays clear for a moment, then Black
                question: "This liquid suddenly turned pitch black. What reaction is this?",
                options: [
                    { text: "Iodine Clock Reaction", points: 20, status: "correct" },
                    { text: "Time-delayed reaction", points: 10, status: "partial" },
                    { text: "Acid-Base Neutralization", points: 0, status: "wrong" }
                ]
            },
            { // Level 4
                bases: [ 
                    { id: 'b1', color: 'rgba(255,255,255,0.1)', label: 'Base 1' },
                    { id: 'b2', color: 'rgba(255,255,255,0.1)', label: 'Base 2' }
                ],
                additives: [ 
                    { id: 'a1', color: 'rgba(0,255,127,0.8)', label: 'Additive A' },
                    { id: 'a2', color: 'rgba(200,0,255,0.8)', label: 'Additive B' },
                    { id: 'a3', color: 'rgba(255,100,0,0.8)', label: 'Additive C' }
                ],
                reactionColors: ['rgba(50, 205, 50, 0.9)'], // Straight to Green
                question: "You mixed Base 2 with an unknown additive. What formed?",
                options: [
                    { text: "Copper(II) Carbonate", points: 20, status: "correct" },
                    { text: "A Copper Solution", points: 10, status: "partial" },
                    { text: "Sugar water", points: 0, status: "wrong" }
                ]
            },
            { // Level 5
                bases: [ 
                    { id: 'b1', color: 'rgba(255,255,255,0.1)', label: 'Base 1' },
                    { id: 'b2', color: 'rgba(255,255,255,0.1)', label: 'Base 2' }
                ],
                additives: [ 
                    { id: 'a1', color: 'rgba(255,20,147,0.8)', label: 'Additive A' },
                    { id: 'a2', color: 'rgba(0,255,127,0.8)', label: 'Additive B' },
                    { id: 'a3', color: 'rgba(255,255,0,0.8)', label: 'Additive C' }
                ],
                reactionColors: ['rgba(255, 255, 255, 0.9)'], // Turns Milky White
                question: "The solution turned cloudy white. What is this process called?",
                options: [
                    { text: "Precipitation Reaction", points: 20, status: "correct" },
                    { text: "Creating a solid", points: 10, status: "partial" },
                    { text: "Boiling", points: 0, status: "wrong" }
                ]
            }
        ];

        let currentLevel = 0;
        let score = 0;
        let selectedTube = null;

        function loadLevel(levelIndex) {
            if (levelIndex >= levels.length) {
                document.getElementById('instructions').innerText = "Game Complete!";
                document.querySelector('.subtitle').innerText = "Final Score: " + score;
                document.getElementById('bases-group').innerHTML = "";
                document.getElementById('additives-group').innerHTML = "";
                return;
            }

            const level = levels[levelIndex];
            document.getElementById('level-display').innerText = `Level ${levelIndex + 1}`;
            
            // Render Bases (Left)
            const basesGroup = document.getElementById('bases-group');
            basesGroup.innerHTML = '<div class="group-title">BASES</div>';
            level.bases.forEach(base => {
                basesGroup.innerHTML += `
                    <div class="tube-container">
                        <div class="test-tube base" id="${base.id}" onclick="pourIntoBase('${base.id}')">
                            <div class="liquid" style="background-color: ${base.color};"></div>
                        </div>
                        <div class="label">${base.label}</div>
                    </div>
                `;
            });

            // Render Additives (Right)
            const additivesGroup = document.getElementById('additives-group');
            additivesGroup.innerHTML = '<div class="group-title">ADDITIVES</div>';
            level.additives.forEach(add => {
                additivesGroup.innerHTML += `
                    <div class="tube-container">
                        <div class="test-tube additive" id="${add.id}" onclick="selectAdditive('${add.id}')">
                            <div class="liquid" style="background-color: ${add.color};"></div>
                        </div>
                        <div class="label">${add.label}</div>
                    </div>
                `;
            });
        }

        function selectAdditive(tubeId) {
            if (selectedTube) {
                document.getElementById(selectedTube).classList.remove('selected');
            }
            if (selectedTube === tubeId) {
                selectedTube = null;
                return;
            }
            selectedTube = tubeId;
            document.getElementById(tubeId).classList.add('selected');
        }

        function pourIntoBase(baseId) {
            if (!selectedTube) {
                alert("Please tap an additive from the right side first!");
                return;
            }

            let sourceTube = document.getElementById(selectedTube);
            let targetTube = document.getElementById(baseId);
            let sourceLiquid = sourceTube.querySelector('.liquid');
            let targetLiquid = targetTube.querySelector('.liquid');

            sourceTube.classList.remove('selected');
            sourceTube.classList.add('pouring');

            // Refined Distance Calculation so it pours exactly into the cup
            let sourceRect = sourceTube.getBoundingClientRect();
            let targetRect = targetTube.getBoundingClientRect();
            
            let moveX = targetRect.left - sourceRect.left - 30; 
            let moveY = targetRect.top - sourceRect.top - 90; 

            // 1. Move to the target
            sourceTube.style.transform = `translate(${moveX}px, ${moveY}px) rotate(-60deg)`;

            // 2. Empty source AND FILL target
            setTimeout(() => {
                sourceLiquid.style.height = '0'; // Empty additive
                targetLiquid.style.height = '80%'; // Fill base cup up
            }, 500);

            // 3. Return tube and execute multi-stage mixing sequence
            setTimeout(() => {
                sourceTube.style.transform = '';
                sourceTube.classList.remove('pouring');
                
                let sequenceColors = levels[currentLevel].reactionColors;
                let stepTime = 1500; // 1.5 seconds per color change
                
                // Loop through each color in the sequence
                sequenceColors.forEach((color, index) => {
                    setTimeout(() => {
                        targetLiquid.style.backgroundColor = color;
                    }, index * stepTime);
                });
                
                // Calculate total time for all color shifts to finish
                let totalWaitTime = sequenceColors.length * stepTime;
                
                // 4. Pop the quiz ONLY after everything is finished + 1 second to observe
                setTimeout(() => {
                    showQuiz();
                }, totalWaitTime + 1000); 
                
            }, 1500);
            
            selectedTube = null; 
        }

        function showQuiz() {
            const level = levels[currentLevel];
            document.getElementById('quiz-question').innerText = level.question;
            
            const optionsDiv = document.getElementById('quiz-options');
            optionsDiv.innerHTML = ''; 
            
            level.options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.innerText = opt.text;
                btn.onclick = function() { handleAnswer(this, opt.status, opt.points); };
                optionsDiv.appendChild(btn);
            });

            document.getElementById('quiz-modal').style.display = 'flex';
        }

        function handleAnswer(buttonElement, status, points) {
            let allButtons = document.querySelectorAll('.quiz-btn');
            allButtons.forEach(btn => btn.disabled = true);

            if (status === 'correct') {
                buttonElement.style.background = '#32cd32'; 
                score += points;
            } else if (status === 'partial') {
                buttonElement.style.background = '#ffa500'; 
                score += points;
            } else {
                buttonElement.style.background = '#ff4500'; 
            }

            document.getElementById('score-display').innerText = "Score: " + score;

            setTimeout(() => {
                document.getElementById('quiz-modal').style.display = 'none';
                currentLevel++;
                loadLevel(currentLevel);
            }, 2000);
        }

        window.onload = () => loadLevel(0);
    </script>
</body>
</html>
