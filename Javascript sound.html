<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom JS Sound Generator</title>
    <style>
        body { background: #1e1e24; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        button { padding: 20px; font-size: 1.2rem; background: #fca311; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>Custom Sound Engine</h1>
    <p>These sounds are generated by JavaScript, no MP3s needed!</p>

    <div class="btn-grid">
        <button onclick="playCoinSound()">🪙 Coin / Point</button>
        <button onclick="playJumpSound()">⬆️ Jump</button>
        <button onclick="playShootSound()">🔫 Shoot / Laser</button>
        <button onclick="playWrongSound()">❌ Wrong / Error</button>
    </div>

    <script>
        // Set up the Audio Context (The master audio engine)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        // 1. A happy, high-pitched "Coin" or "Point" sound
        function playCoinSound() {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine'; // Smooth tone
            osc.frequency.setValueAtTime(1000, audioCtx.currentTime); // Start high
            osc.frequency.exponentialRampToValueAtTime(2000, audioCtx.currentTime + 0.1); // Slide even higher
            
            gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); // Fade out quickly
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // 2. A bouncing "Jump" sound
        function playJumpSound() {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime); // Start low
            osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2); // Slide up rapidly
            
            gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // 3. A retro arcade "Laser" or "Shoot" sound
        function playShootSound() {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'square'; // Harsh, retro 8-bit tone
            osc.frequency.setValueAtTime(800, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2); // Pitch drops rapidly
            
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        // 4. A harsh "Buzzer" for wrong answers
        function playWrongSound() {
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sawtooth'; // Gritty, buzzing tone
            osc.frequency.setValueAtTime(150, audioCtx.currentTime); 
            osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3); // Drops pitch slightly
            
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    </script>
</body>
</html>
