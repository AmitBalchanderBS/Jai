<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Spectral Garden - Filter Grid</title>
    <style>
        /* CSS RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #030305; /* Deep gallery black */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            /* Subtle organic background texture */
            background-image: radial-gradient(circle at 50% 50%, #0a0a1a 0%, #000 100%);
        }

        /* EXHIBIT CONTAINER */
        .exhibit-card {
            background: rgba(15, 15, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            max-width: 1050px; 
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 255, 150, 0.05);
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 850px) {
            .exhibit-card {
                flex-direction: row; 
            }
        }

        /* IMAGE VIEWER PORTION */
        .image-section {
            flex: 1.5; 
            position: relative;
            background: #000;
            aspect-ratio: 4 / 3; 
            overflow: hidden;
        }

        .base-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            /* Slight contrast bump to make the colors pop harder under filters */
            filter: contrast(1.1) saturate(1.2); 
        }

        /* THE MAGIC: CSS MULTIPLY BLEND MODE */
        .filter-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            mix-blend-mode: multiply;
            background-color: rgb(255, 255, 255); 
            transition: background-color 0.5s ease;
            pointer-events: none;
            z-index: 10;
        }

        /* CONTROLS PORTION */
        .control-section {
            flex: 1;
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: rgba(5, 5, 10, 0.95);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
        }

        .control-section h2 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e0e0e0;
        }

        .control-section p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.65);
            line-height: 1.6;
            margin-bottom: 2.5rem;
            min-height: 130px; 
        }

        /* THE BUTTON GRID */
        .filter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        /* Active Button Styling (Changes based on the selected filter) */
        .filter-btn.active[data-color="clear"] { 
            border-color: #ffffff; 
            background: rgba(255, 255, 255, 0.15); 
        }
        .filter-btn.active[data-color="red"] { 
            border-color: #ff3333; 
            background: rgba(255, 51, 51, 0.15); 
            color: #ff6666; 
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.2);
        }
        .filter-btn.active[data-color="green"] { 
            border-color: #33ff33; 
            background: rgba(51, 255, 51, 0.15); 
            color: #66ff66; 
            box-shadow: 0 0 15px rgba(51, 255, 51, 0.2);
        }
        .filter-btn.active[data-color="blue"] { 
            border-color: #3388ff; 
            background: rgba(51, 136, 255, 0.15); 
            color: #66aaff; 
            box-shadow: 0 0 15px rgba(51, 136, 255, 0.2);
        }

    </style>
</head>
<body>

    <div class="exhibit-card">
        
        <!-- VISUAL SECTION -->
        <div class="image-section">
            <!-- A chaotic, multi-colored floral scene to act as the RGB playground -->
            <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?q=80&w=1200&auto=format&fit=crop" alt="Vibrant RGB Garden" class="base-image">
            <div class="filter-overlay" id="filter-overlay"></div>
        </div>

        <!-- INTERACTIVE CONTROLS -->
        <div class="control-section">
            <h2>Botanical Spectra</h2>
            <p id="info-text">A vibrant garden is a natural canvas of chaotic pigments. Sunlight (pure white light) floods the scene, and organic chemistry dictates which wavelengths are absorbed into the plants, and which bounce back to your eye.</p>
            
            <div class="filter-grid">
                <button class="filter-btn active" data-color="clear">Full Light</button>
                <button class="filter-btn" data-color="red">Red Filter</button>
                <button class="filter-btn" data-color="green">Green Filter</button>
                <button class="filter-btn" data-color="blue">Blue Filter</button>
            </div>
        </div>

    </div>

    <script>
        // Physics data tailored to organic plant life and floral pigments
        const filterData = {
            clear: {
                rgb: 'rgb(255, 255, 255)', 
                text: "A vibrant garden is a natural canvas of chaotic pigments. Sunlight (pure white light) floods the scene, and organic chemistry dictates which wavelengths are absorbed into the plants, and which bounce back to your eye."
            },
            red: {
                rgb: 'rgb(255, 0, 0)',
                text: "The red filter absorbs all green and blue light. Notice how the dominant green foliage instantly plunges into heavy black shadow. Only the flowers reflecting red wavelengths survive the filter, floating in the darkness."
            },
            green: {
                rgb: 'rgb(0, 255, 0)',
                text: "The green filter acts like a spotlight for chlorophyll. The foliage remains bright and vibrant, but the red and blue blossoms are completely absorbed, leaving dark, empty voids where the brightest flowers used to be."
            },
            blue: {
                rgb: 'rgb(0, 0, 255)',
                text: "The blue filter strips away the lush green leaves and warm red petals. Organic blue pigment is rare in nature, so this filter forces almost the entire garden into silhouette, isolating only the coolest blue and violet blooms."
            }
        };

        // DOM Elements
        const overlay = document.getElementById('filter-overlay');
        const infoText = document.getElementById('info-text');
        const buttons = document.querySelectorAll('.filter-btn');

        // Event Listener for the grid
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const colorKey = button.getAttribute('data-color');
                
                // 1. Update the CSS Overlay Color
                overlay.style.backgroundColor = filterData[colorKey].rgb;
                
                // 2. Update the Educational Text
                infoText.innerText = filterData[colorKey].text;
                
                // 3. Update Button Active States
                buttons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
            });
        });
    </script>

</body>
</html>
