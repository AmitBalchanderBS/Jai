<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean Mimic AR Prototype</title>
    
    <!-- CSS Styling (The Look) -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        #game-container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 4px solid #4CAF50;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.3);
            background-color: #000;
        }
        /* Hide the raw video feed, we only show the processed canvas */
        video {
            display: none; 
        }
        /* Mirror the canvas so it acts like a real mirror */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transform: scaleX(-1); 
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            border: 1px solid #333;
        }
        h1 { margin: 0 0 10px 0; font-size: 22px; color: #4CAF50; text-transform: uppercase; letter-spacing: 1px; }
        p { margin: 5px 0; font-size: 16px; color: #ddd;}
        .target-box {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 2;
            background: rgba(0,0,0,0.75);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #333;
        }
        .target-box .placeholder {
            width: 100px;
            height: 100px;
            background: #333;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius: 5px;
            font-weight: bold;
            color: #aaa;
            margin-top: 5px;
        }
    </style>

    <!-- MediaPipe Machine Learning Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- HTML Layout -->
    <div id="game-container">
        <video id="input_video" width="640" height="480" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
        
        <div id="ui-layer">
            <h1>Bean Mimic OS</h1>
            <p>Target: <strong style="color:white;">The Jaw Drop</strong></p>
            <p>Mouth Ratio: <span id="ratio-display">0.000</span></p>
            <p>Match Score: <span id="score-display" style="font-size: 24px; font-weight:bold; color: #FFC107;">0%</span></p>
        </div>

        <div class="target-box">
            <p style="margin: 0; font-size: 12px; color: #aaa; text-transform: uppercase;">Mimic This!</p>
            <div class="placeholder">
               OPEN WIDE
            </div>
        </div>
    </div>
    
    <p style="margin-top: 20px; max-width: 500px; text-align: center; color: #888; line-height: 1.5;">
        Step back so your whole face is visible. Open your mouth wide to try and hit a 100% match score!
    </p>

    <!-- JavaScript Logic (The Engine) -->
    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const ratioDisplay = document.getElementById('ratio-display');
        const scoreDisplay = document.getElementById('score-display');

        // Helper function to calculate distance using Pythagorean theorem
        function calculateDistance(p1, p2) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // The target ratio to beat (This represents Mr. Bean's wide open mouth)
        const TARGET_JAW_DROP_RATIO = 0.22; 

        // This function runs every single time the camera captures a new frame
        function onResults(results) {
            // Clear the canvas for the new frame
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Draw the raw video frame onto the canvas
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            // If the AI detects a face...
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                // Draw a green wireframe over the lips for visual feedback
                drawConnectors(canvasCtx, landmarks, FACEMESH_LIPS, {color: '#4CAF50', lineWidth: 2});
                
                // --- THE MATH ENGINE ---
                
                // 1. Grab the specific landmark points from MediaPipe
                const topLip = landmarks[13];
                const bottomLip = landmarks[14];
                const leftCheek = landmarks[234];
                const rightCheek = landmarks[454];

                // 2. Calculate heights and widths
                const mouthHeight = calculateDistance(topLip, bottomLip);
                const faceWidth = calculateDistance(leftCheek, rightCheek);
                
                // 3. Create the scale-proof ratio
                const mouthRatio = mouthHeight / faceWidth;
                
                // 4. Update the raw ratio on screen
                ratioDisplay.innerText = mouthRatio.toFixed(3);

                // 5. Calculate the Match Score
                let score = (mouthRatio / TARGET_JAW_DROP_RATIO) * 100;
                score = Math.min(100, Math.max(0, score)); // Lock the score between 0 and 100
                
                scoreDisplay.innerText = Math.round(score) + "%";
                
                // 6. Visual feedback if they nail the pose
                if (score >= 95) {
                    scoreDisplay.style.color = "#4CAF50"; // Turn score green
                    // Flash a green tint over the whole screen
                    canvasCtx.fillStyle = "rgba(76, 175, 80, 0.2)"; 
                    canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);
                } else {
                    scoreDisplay.style.color = "#FFC107"; // Keep score yellow
                }
            }
            canvasCtx.restore();
        }

        // Setup MediaPipe Face Mesh AI
        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onResults);

        // Turn on the WebCam
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        camera.start();
    </script>
</body>
</html>
