<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Head Dodge AR</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 640px;
            height: 480px;
            border: 4px solid #00d2ff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            background-color: #000;
        }
        video {
            display: none; 
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            /* Do not mirror the canvas in CSS for this game, we handle it in JS for collision accuracy */
        }
        #ui-layer {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 2;
            pointer-events: none;
        }
        h1 { margin: 0; font-size: 24px; color: #00d2ff; text-transform: uppercase; }
        #score-display { font-size: 32px; font-weight: bold; color: #fff; margin-top: 5px; }
        
        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            text-align: center;
            pointer-events: none;
        }
        .hidden { display: none; }
        #game-over-text { color: #ff003c; font-size: 48px; font-weight: bold; text-shadow: 0 0 10px red; margin: 0;}
        #restart-text { color: #fff; font-size: 18px; margin-top: 10px; }
    </style>

    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="game-container">
        <video id="input_video" width="640" height="480" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
        
        <div id="ui-layer">
            <h1>Score</h1>
            <div id="score-display">0</div>
        </div>

        <div id="message-overlay">
            <h2 id="status-text" style="color: #00d2ff;">Loading Camera...</h2>
            <div id="game-over-screen" class="hidden">
                <p id="game-over-text">GAME OVER</p>
                <p id="restart-text">Move head to center to restart</p>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const statusText = document.getElementById('status-text');
        const gameOverScreen = document.getElementById('game-over-screen');

        // Game State Variables
        let isGameRunning = false;
        let isCameraReady = false;
        let score = 0;
        let frameCount = 0;
        let gameSpeed = 5;

        // Player (Controlled by Nose)
        const player = {
            x: 320, // Starts in middle
            y: 400, // Fixed near the bottom
            size: 40,
            color: '#00d2ff'
        };

        // Obstacles Array
        let obstacles = [];

        // Game Loop Functions
        function spawnObstacle() {
            const size = Math.random() * 30 + 30; // Random size between 30 and 60
            const x = Math.random() * (canvasElement.width - size);
            obstacles.push({
                x: x,
                y: -size, // Start above screen
                width: size,
                height: size,
                color: '#ff003c'
            });
        }

        function resetGame() {
            obstacles = [];
            score = 0;
            gameSpeed = 5;
            frameCount = 0;
            scoreDisplay.innerText = score;
            gameOverScreen.classList.add('hidden');
            isGameRunning = true;
        }

        // Main Drawing and Logic Loop (Runs every time the AI updates)
        function onResults(results) {
            if (!isCameraReady) {
                isCameraReady = true;
                statusText.classList.add('hidden');
                resetGame();
            }

            // Clear Canvas
            canvasCtx.fillStyle = 'rgba(17, 17, 17, 0.6)'; // Slight motion blur effect
            canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

            // 1. Update Player Position based on Nose Tracking
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const nose = results.multiFaceLandmarks[0][1]; // Landmark 1 is the nose tip
                
                // Map the normalized X coordinate (0 to 1) to the canvas width
                // We subtract from canvasElement.width to mirror the movement naturally
                player.x = canvasElement.width - (nose.x * canvasElement.width) - (player.size / 2);
                
                // Keep player within bounds
                if (player.x < 0) player.x = 0;
                if (player.x > canvasElement.width - player.size) player.x = canvasElement.width - player.size;
            }

            // Draw Player
            canvasCtx.fillStyle = player.color;
            canvasCtx.fillRect(player.x, player.y, player.size, player.size);

            if (isGameRunning) {
                frameCount++;
                
                // Spawn obstacles every ~45 frames (gets faster as score increases)
                if (frameCount % Math.max(20, 45 - Math.floor(score/10)) === 0) {
                    spawnObstacle();
                }

                // Update and Draw Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.y += gameSpeed; // Move down

                    // Draw Obstacle
                    canvasCtx.fillStyle = obs.color;
                    canvasCtx.fillRect(obs.x, obs.y, obs.width, obs.height);

                    // Collision Detection (AABB - Axis-Aligned Bounding Box)
                    if (player.x < obs.x + obs.width &&
                        player.x + player.size > obs.x &&
                        player.y < obs.y + obs.height &&
                        player.y + player.size > obs.y) {
                        // HIT!
                        isGameRunning = false;
                        gameOverScreen.classList.remove('hidden');
                    }

                    // Remove obstacles that fall off screen and add points
                    if (obs.y > canvasElement.height) {
                        obstacles.splice(i, 1);
                        score++;
                        scoreDisplay.innerText = score;
                        
                        // Slowly increase speed
                        if (score % 5 === 0) {
                            gameSpeed += 0.5;
                        }
                    }
                }
            } else {
                // Game Over State - Check if player moves to center to restart
                // Center is roughly x: 280 to 360
                if (player.x > 280 && player.x < 360) {
                     // Adding a tiny delay so it doesn't instantly restart
                     setTimeout(() => {
                         if(!isGameRunning && player.x > 280 && player.x < 360){
                            resetGame();
                         }
                     }, 1000);
                }
            }
        }

        // Setup MediaPipe
        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});
        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        faceMesh.onResults(onResults);

        // Start Camera
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
