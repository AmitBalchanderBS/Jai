<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny Grabber</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Press Start 2P', cursive; /* Retro arcade font */
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        
        #game-container {
            width: 800px;
            margin: 0 auto;
            position: relative;
        }

        /* --- UI Screens --- */
        #start-screen, #transition-screen, #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 500px;
            background: #111;
            border: 4px solid #0ff; /* Cyan border */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        h1 { color: #f0f; text-shadow: 2px 2px #0ff; font-size: 24px; line-height: 1.5; }
        h2 { color: #ff0; font-size: 16px; margin: 20px 0; }
        p { font-size: 10px; line-height: 1.8; max-width: 600px; color: #ccc; }

        /* Character Select mimic */
        .char-select {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .char-card {
            width: 100px; height: 140px;
            border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center;
        }
        .char-card.active { background: #f0f; border-color: #0ff; }
        .char-card.locked1 { background: #ff0; }
        .char-card.locked2 { background: #0aa; }
        .sprite { font-size: 40px; }

        input[type="text"] {
            font-family: 'Press Start 2P', cursive;
            padding: 10px; font-size: 12px;
            border: 2px solid #0ff; background: #000; color: #0ff;
            text-align: center; width: 300px; margin-bottom: 20px;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            background: #000; color: #0ff;
            border: 2px solid #f0f; padding: 15px 20px;
            font-size: 14px; cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #f0f; color: #fff; box-shadow: 0 0 15px #f0f; }

        .hidden { display: none !important; }

        /* --- Canvas & HUD --- */
        #hud {
            display: flex; justify-content: space-between;
            padding: 10px; background: #222; border: 2px solid #f0f;
            margin-bottom: 5px; font-size: 12px;
        }
        canvas {
            background: #050510;
            border: 4px solid #f0f;
            display: block;
        }
    </style>
</head>
<body>

<div id="game-container">
    
    <!-- HUD -->
    <div id="hud" class="hidden">
        <div>PLAYER: <span id="hud-name"></span></div>
        <div>LEVEL: <span id="hud-level">1</span></div>
        <div>LIVES: <span id="hud-lives">3</span></div>
        <div>SCORE: <span id="hud-score">0</span></div>
    </div>

    <!-- Start Screen (Inspired by 1000157850.gif) -->
    <div id="start-screen">
        <h1>CHARACTER SELECT</h1>
        <div class="char-select">
            <div class="char-card active"><span class="sprite">🧍‍♂️</span></div>
            <div class="char-card locked1"><span class="sprite" style="color:#000;">?</span></div>
            <div class="char-card locked2"><span class="sprite" style="color:#000;">?</span></div>
        </div>
        <input type="text" id="player-name" placeholder="ENTER NAME" autocomplete="off">
        <button onclick="startGame()">PRESS A TO GRAB DESTINY</button>
    </div>

    <!-- Level Transition / Science Facts -->
    <div id="transition-screen" class="hidden">
        <h1 id="trans-title">LEVEL 1</h1>
        <h2 id="trans-subtitle" style="color: #0ff;">The Amazon Canopy</h2>
        <p id="trans-fact" style="text-align: left; padding: 0 40px;"></p>
        <button onclick="startLevelLoop()" style="margin-top: 30px;">BEGIN LEVEL</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="hidden">
        <h1 id="end-title">GAME OVER</h1>
        <h2>FINAL SCORE: <span id="end-score"></span></h2>
        <button onclick="location.reload()">INSERT COIN (RETRY)</button>
    </div>

    <!-- The Game Canvas -->
    <canvas id="gameCanvas" width="800" height="500"></canvas>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let playerName = "";
    let score = 0;
    let lives = 3;
    let currentLevel = 1;
    let gameLoopId;
    let isPlaying = false;
    
    // Controls
    let keys = { ArrowLeft: false, ArrowRight: false };

    // Player Object
    const player = {
        x: 375, y: 430, width: 50, height: 60, speed: 7, color: '#0ff'
    };

    // Falling Objects
    let fallingObjects = [];
    let frameCount = 0;

    // Science Levels Data
    const levelsData = [
        {
            title: "LEVEL 1",
            theme: "The Amazon Canopy",
            fact: "NAT GEO FACT: The Amazon Rainforest creates its own weather! The millions of trees release water vapor through transpiration, forming massive 'flying rivers' in the sky that eventually fall back down as rain. \n\nMISSION: Catch the falling Raindrops (🟦). Dodge the Toxic Frogs (🟩).",
            goodColor: '#00f', badColor: '#0f0',
            goodSpeed: 3, badSpeed: 4, spawnRate: 60, targetScore: 100
        },
        {
            title: "LEVEL 2",
            theme: "The Deep Ocean",
            fact: "DISCOVERY FACT: Down in the Midnight Zone of the ocean, sunlight cannot reach. Animals like the Anglerfish use 'Bioluminescence'—a chemical reaction inside their bodies that produces light—to lure in prey in total darkness. \n\nMISSION: Catch Bioluminescent Orbs (🟨). Dodge the Giant Squid Ink (⬛).",
            goodColor: '#ff0', badColor: '#444',
            goodSpeed: 5, badSpeed: 5, spawnRate: 45, targetScore: 300
        },
        {
            title: "LEVEL 3",
            theme: "Orbital Mechanics",
            fact: "SCIENCE FACT: To stay in orbit around Earth, a satellite must travel fast enough sideways (about 17,500 mph) that as gravity pulls it down, the Earth's surface curves away underneath it. This constant free-fall is applied engineering physics! \n\nMISSION: Catch the Data Satellites (⬜). Dodge the Space Debris (🟥). High speed incoming!",
            goodColor: '#fff', badColor: '#f00',
            goodSpeed: 7, badSpeed: 8, spawnRate: 30, targetScore: 600
        }
    ];

    document.addEventListener("keydown", (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
    document.addEventListener("keyup", (e) => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

    function startGame() {
        const nameInput = document.getElementById("player-name").value;
        if (nameInput.trim() === "") { alert("ENTER YOUR NAME TO CONTINUE."); return; }
        
        playerName = nameInput.toUpperCase();
        document.getElementById("hud-name").innerText = playerName;
        
        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("hud").classList.remove("hidden");
        
        showTransition();
    }

    function showTransition() {
        isPlaying = false;
        cancelAnimationFrame(gameLoopId);
        fallingObjects = [];
        player.x = 375; // reset position

        if (currentLevel > 3) {
            triggerGameOver(true);
            return;
        }

        const lvl = levelsData[currentLevel - 1];
        document.getElementById("trans-title").innerText = lvl.title;
        document.getElementById("trans-subtitle").innerText = lvl.theme;
        document.getElementById("trans-fact").innerText = lvl.fact;
        
        document.getElementById("transition-screen").classList.remove("hidden");
    }

    function startLevelLoop() {
        document.getElementById("transition-screen").classList.add("hidden");
        document.getElementById("hud-level").innerText = currentLevel;
        isPlaying = true;
        updateLoop();
    }

    function spawnObject() {
        const lvl = levelsData[currentLevel - 1];
        const isGood = Math.random() > 0.4; // 60% chance for good item
        const obj = {
            x: Math.random() * (canvas.width - 20),
            y: -20,
            width: 20, height: 20,
            isGood: isGood,
            speed: isGood ? lvl.goodSpeed : lvl.badSpeed,
            color: isGood ? lvl.goodColor : lvl.badColor
        };
        fallingObjects.push(obj);
    }

    function updateLoop() {
        if (!isPlaying) return;

        // Clear Canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Move Player
        if (keys.ArrowLeft && player.x > 0) player.x -= player.speed;
        if (keys.ArrowRight && player.x < canvas.width - player.width) player.x += player.speed;

        // Draw Player (Retro Blocky Style)
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        // Draw little pink vest
        ctx.fillStyle = '#f0f';
        ctx.fillRect(player.x + 10, player.y + 15, player.width - 20, player.height - 30);

        // Handle Falling Objects
        const lvl = levelsData[currentLevel - 1];
        frameCount++;
        if (frameCount % lvl.spawnRate === 0) spawnObject();

        for (let i = 0; i < fallingObjects.length; i++) {
            let obj = fallingObjects[i];
            obj.y += obj.speed;

            // Draw Object
            ctx.fillStyle = obj.color;
            ctx.fillRect(obj.x, obj.y, obj.width, obj.height);

            // Collision Detection
            if (obj.y + obj.height > player.y && obj.y < player.y + player.height &&
                obj.x + obj.width > player.x && obj.x < player.x + player.width) {
                
                if (obj.isGood) {
                    score += 20;
                    document.getElementById("hud-score").innerText = score;
                } else {
                    lives--;
                    document.getElementById("hud-lives").innerText = lives;
                    playerFlash();
                }
                fallingObjects.splice(i, 1);
                i--;
            } 
            // Remove if off screen
            else if (obj.y > canvas.height) {
                fallingObjects.splice(i, 1);
                i--;
            }
        }

        // Check Win/Loss conditions
        if (lives <= 0) {
            triggerGameOver(false);
            return;
        }

        if (score >= lvl.targetScore) {
            currentLevel++;
            showTransition();
            return;
        }

        gameLoopId = requestAnimationFrame(updateLoop);
    }

    function playerFlash() {
        player.color = '#f00';
        setTimeout(() => player.color = '#0ff', 200);
    }

    function triggerGameOver(isVictory) {
        isPlaying = false;
        cancelAnimationFrame(gameLoopId);
        document.getElementById("hud").classList.add("hidden");
        document.getElementById("game-over-screen").classList.remove("hidden");
        
        document.getElementById("end-title").innerText = isVictory ? "MISSION ACCOMPLISHED!" : "GAME OVER";
        document.getElementById("end-title").style.color = isVictory ? "#0ff" : "#f00";
        document.getElementById("end-score").innerText = score;
    }
</script>
</body>
</html>
